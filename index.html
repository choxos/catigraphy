  </head>
  <body>
    <script>
      // Resolve the theme before the first paint so a dark mode reader never
      // sees a white flash. The stored choice wins; otherwise follow the system.
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("catigraphy-theme");
        } catch {}
        if (theme !== "dark" && theme !== "light")
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <!-- The interface is written into #app before the WebGL context is asked
         for, so a crawler that runs scripts gets all of it. This block is for
         the ones that do not run scripts at all. -->
    <noscript>
      <h1>Catigraphy</h1>
      <p>
        An interactive CT atlas of the domestic cat, built from twelve computed
        tomography series of one specimen published on MorphoSource by 3D
        Anatomy Studios. It needs JavaScript and a browser with WebGL.
      </p>
      <p>Inside it:</p>
      <ul>
        <li>
          Eleven scenes as 3D bone surfaces you can rotate, fade and cut with a
          section plane: the whole skeleton of the animal, the skull with its
          mandible and atlas, each part of the vertebral column, the pelvis and
          both limbs.
        </li>
        <li>
          The slices themselves, in three planes, with bone and soft tissue
          windows. The soft tissue is on the slices and nowhere else.
        </li>
        <li>
          Fifteen named landmarks on the skull, and a written note on what to
          look for in every region.
        </li>
        <li>
          A reference section on the cat skeleton: the vertebral and dental
          formulae, the skull, the vertebral column and the limbs.
        </li>
      </ul>
      <p>
        The two whole animal scans overlap along the lumbar spine and share five
        metal fiducials, so they are registered and fused into one skeleton,
        agreeing to a median of 0.28 mm on bone. The ten regional scans share no
        field with anything and stay in their own frames of reference, so the
        rest of the atlas is regional. The bones within a region are not
        separated from one another.
      </p>
      <p>
        Source code and the scans it is built from:
        <a href="https://github.com/choxos/catigraphy">github.com/choxos/catigraphy</a>.
      </p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
